name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: |
          python -m pip wheel . --no-deps -w dist
          python - <<'PY'
          import glob
          import zipfile
          wheel = zipfile.ZipFile(glob.glob('dist/*.whl')[0])
          for template in ('dashboard.html.j2', 'summary.html.j2'):
              assert f'code_compass/templates/{template}' in wheel.namelist()
          PY
