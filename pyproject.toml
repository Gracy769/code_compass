[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-compass"
version = "0.1.0"
description = "CLI tool that analyses a local Git repository and emits a self-contained HTML dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tree-sitter>=0.24",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "click>=8.1",
    "gitpython>=3.1",
    "jinja2>=3.1",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "httpx>=0.27",
]

[project.scripts]
code-compass = "code_compass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
code_compass = ["templates/*.j2"]
